[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard"
version = "0.1.0"
description = "A tray soundboard with configurable global hotkeys."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.2,<5",
    "pygame>=2.5,<3",
    "pynput>=1.7,<2",
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
soundboard = "soundboard.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

